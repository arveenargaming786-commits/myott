name: Debug crash log

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build with Firebase plugin
        run: |
          mkdir -p www
          cp *.html *.css *.js manifest.json icon-*.png www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-firebase/authentication@6 firebase@10
          cat > capacitor.config.json <<'EOT'
          {
            "appId": "com.myott.app",
            "appName": "ScreenBox",
            "webDir": "www",
            "backgroundColor": "#220509",
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": true,
                "providers": ["google.com"]
              }
            }
          }
          EOT
          npx cap add android
          cp google-services.json android/app/google-services.json
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app in emulator and print crash log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell monkey -p com.myott.app -c android.intent.category.LAUNCHER 1
            sleep 20
            adb logcat -d | grep -E "AndroidRuntime|FATAL|Caused by|FirebaseApp|Capacitor" | head -80
